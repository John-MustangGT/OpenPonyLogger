[platformio]
default_envs = flash

; ============================================================================
; Common configuration shared by all environments
; ============================================================================
[common]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
monitor_port = COM10
monitor_filters =
    esp32_exception_decoder
    time
    colorize
upload_port = COM10
upload_protocol = esptool
upload_speed = 460800

lib_deps =
    Adafruit Unified Sensor
    Adafruit BusIO
    Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.1
    adafruit/Adafruit NeoPixel@^1.12.0
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    ArduinoJson
    h2zero/NimBLE-Arduino@^1.4.1

; Custom build scripts
; - generate_version.py: Capture git info at build time
; - custom_targets.py: Add erase targets (pio run -t erase, -t erase_flash)
extra_scripts =
    pre:scripts/generate_version.py
    scripts/custom_targets.py

build_flags =
    -DPLATFORMIO
    -DARDUINO_ESP32_S3
    -std=c++17
    -Wall
    -DUSE_IMPERIAL=1  # Set to 0 for metric (km/h, °C)
    -DBOARD_HAS_PSRAM   # Enable 2MB PSRAM on ESP32-S3 Feather
    -I components/logging/include
    -I lib/Logger/include
    -I lib/Storage/include
    -I lib/Config/include

board_build.arduino.memory_type = qio_qspi  # Enable QSPI PSRAM (Adafruit Feather has Quad SPI)
board_build.psram_type = qspi
board_build.flash_mode = qio

build_src_filter = +<*> -<.git/> -<.pio> -<test_> -<tools/>
lib_ldf_mode = deep+

; ============================================================================
; Flash Storage Build - Internal 2MB flash partition (current design)
; ============================================================================
[env:flash]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
monitor_filters = ${common.monitor_filters}
upload_port = ${common.upload_port}
upload_protocol = ${common.upload_protocol}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
build_src_filter = ${common.build_src_filter}
lib_ldf_mode = ${common.lib_ldf_mode}

board_build.partitions = partitions_flash.csv

build_flags =
    ${common.build_flags}
    -DUSE_FLASH_STORAGE=1

; ============================================================================
; SD Card Storage Build - Adalogger FeatherWing with SD card
; ============================================================================
[env:sdcard]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
monitor_filters = ${common.monitor_filters}
upload_port = ${common.upload_port}
upload_protocol = ${common.upload_protocol}
upload_speed = ${common.upload_speed}
build_src_filter = ${common.build_src_filter}
lib_ldf_mode = ${common.lib_ldf_mode}

board_build.partitions = partitions_sdcard.csv

lib_deps =
    ${common.lib_deps}
    SD

build_flags =
    ${common.build_flags}
    -DUSE_SD_CARD=1
    -DSD_CS_PIN=10      ; Adalogger FeatherWing SD chip select
    -DSD_MOSI_PIN=35    ; ESP32-S3 SPI MOSI
    -DSD_MISO_PIN=37    ; ESP32-S3 SPI MISO
    -DSD_SCK_PIN=36     ; ESP32-S3 SPI SCK

; ============================================================================
; Legacy environment name (redirects to flash build)
; ============================================================================
[env:esp32s3dev]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_port = ${common.monitor_port}
monitor_filters = ${common.monitor_filters}
upload_port = ${common.upload_port}
upload_protocol = ${common.upload_protocol}
upload_speed = ${common.upload_speed}
lib_deps = ${common.lib_deps}
build_src_filter = ${common.build_src_filter}
lib_ldf_mode = ${common.lib_ldf_mode}

board_build.partitions = partitions_flash.csv

build_flags =
    ${common.build_flags}
    -DUSE_FLASH_STORAGE=1 

[env:test]
platform = native
test_framework = unity
build_flags =
    -DTEST_MODE
    -Wall
